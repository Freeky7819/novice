name: Osveži novice
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch.py
      - name: AI povzetki (brez ključa ostane Uradno)
        continue-on-error: true
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          AI_MAX_PER_RUN: ${{ vars.AI_MAX_PER_RUN }}
          AI_MAX_PER_DAY: ${{ vars.AI_MAX_PER_DAY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python summarize.py
      - uses: actions/upload-artifact@v4
        with:
          name: feed-data
          path: data/*.json
          retention-days: 1
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  commit:
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: feed-data
          path: data
      - name: Commit samo data/ in samo ob spremembi
        run: |
          git config user.name 'novice-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/*.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh news feed'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
  deploy:
    needs: commit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
