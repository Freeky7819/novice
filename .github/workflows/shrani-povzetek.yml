name: Shrani povzetek
on:
  repository_dispatch:
    types: [povzetek]
permissions:
  contents: write
concurrency:
  group: pages
  queue: max
  cancel-in-progress: false
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Preveri dogodek in shrani samo veljaven povzetek
        id: validate
        run: python save_summary.py
      - name: Commit samo summaries.json
        env:
          ARTICLE_ID: ${{ steps.validate.outputs.article_id }}
        run: |
          git config user.name 'novice-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/summaries.json
          if ! git diff --cached --quiet; then
            git commit -m "data: povzetek $ARTICLE_ID"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    needs: save
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
